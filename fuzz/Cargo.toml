[package]
name = "rusplay-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
rusplay-config.path = "../crates/rusplay-config"
rusplay-core.path = "../crates/rusplay-core"
rusplay-decode = { path = "../crates/rusplay-decode", features = ["fuzzing", "software"] }
rusplay-input.path = "../crates/rusplay-input"
rusplay-net.path = "../crates/rusplay-net"
rusplay-protocol.path = "../crates/rusplay-protocol"

[[bin]]
name = "discovery"
path = "fuzz_targets/discovery.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pairing"
path = "fuzz_targets/pairing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reconnect"
path = "fuzz_targets/reconnect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control"
path = "fuzz_targets/control.rs"
test = false
doc = false
bench = false

[[bin]]
name = "clipboard"
path = "fuzz_targets/clipboard.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cursor"
path = "fuzz_targets/cursor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "input"
path = "fuzz_targets/input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "headers"
path = "fuzz_targets/headers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reassembly"
path = "fuzz_targets/reassembly.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_h264"
path = "fuzz_targets/decode_h264.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_hevc"
path = "fuzz_targets/decode_hevc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_av1"
path = "fuzz_targets/decode_av1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_software"
path = "fuzz_targets/decode_software.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_color"
path = "fuzz_targets/decode_color.rs"
test = false
doc = false
bench = false

[patch.crates-io]
rav1d.path = "../vendor/rav1d"

[profile.release.package.cros-codecs]
debug-assertions = true
overflow-checks = false
