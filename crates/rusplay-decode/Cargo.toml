[package]
name = "rusplay-decode"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
fuzzing = ["nvdec", "vaapi", "rusplay-va/detached"]
nvdec = ["dep:cros-codecs", "dep:rusplay-cuda"]
software = ["dep:rav1d"]
software-asm = ["software", "rav1d/asm"]
vaapi = ["dep:cros-codecs", "dep:rusplay-va", "rusplay-va/libva"]

[dependencies]
cros-codecs = { workspace = true, optional = true }
rav1d = { workspace = true, optional = true, features = ["bitdepth_8", "bitdepth_16"] }
rusplay-config.workspace = true
rusplay-core.workspace = true
rusplay-cuda = { workspace = true, optional = true }
rusplay-va = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
pollster.workspace = true
rusplay-scale.workspace = true
wgpu.workspace = true

[lints]
workspace = true
