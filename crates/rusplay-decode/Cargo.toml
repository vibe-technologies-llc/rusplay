[package]
name = "rusplay-decode"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
software = ["dep:rav1d"]
software-asm = ["software", "rav1d/asm"]
vaapi = ["dep:bindgen", "dep:cros-codecs", "dep:pkg-config"]

[dependencies]
cros-codecs = { workspace = true, optional = true }
rav1d = { workspace = true, optional = true, features = ["bitdepth_8", "bitdepth_16"] }
rusplay-config.workspace = true
rusplay-core.workspace = true
thiserror.workspace = true

[build-dependencies]
bindgen = { workspace = true, optional = true }
pkg-config = { workspace = true, optional = true }
thiserror.workspace = true

[lints]
workspace = true
