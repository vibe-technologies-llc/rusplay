[package]
name = "rusplay-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
flac = ["rusplay-audio/flac"]
nvdec = ["rusplay-decode/nvdec"]
pipewire = ["rusplay-audio/pipewire"]
software = ["rusplay-decode/software"]
software-asm = ["rusplay-decode/software-asm"]
vaapi = ["rusplay-decode/vaapi"]
window = [
    "dep:half",
    "dep:pollster",
    "dep:rustix",
    "rusplay-input/wayland",
    "wayland-client/dlopen",
    "wayland-client/system"
]

[dependencies]
half = { workspace = true, optional = true }
parking_lot.workspace = true
pollster = { workspace = true, optional = true }
rusplay-audio.workspace = true
rusplay-config.workspace = true
rusplay-core.workspace = true
rusplay-decode.workspace = true
rusplay-input = { workspace = true, features = ["gamepad"] }
rusplay-net.workspace = true
rusplay-protocol.workspace = true
rusplay-scale.workspace = true
rustix = { workspace = true, features = ["event", "time"], optional = true }
thiserror.workspace = true
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client", "staging"] }
wgpu.workspace = true

[dev-dependencies]
half.workspace = true
pollster.workspace = true

[lints]
workspace = true
