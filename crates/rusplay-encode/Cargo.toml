[package]
name = "rusplay-encode"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
x264 = ["dep:bindgen", "dep:pkg-config"]
x265 = ["dep:bindgen", "dep:pkg-config"]
svt-av1 = ["dep:bindgen", "dep:parking_lot", "dep:pkg-config"]
vaapi = ["dep:parking_lot", "dep:rusplay-va", "rusplay-va/libva"]
nvenc = ["dep:parking_lot", "dep:rusplay-cuda"]

[dependencies]
parking_lot = { workspace = true, optional = true }
rusplay-config.workspace = true
rusplay-core.workspace = true
rusplay-cuda = { workspace = true, optional = true }
rusplay-va = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
cros-codecs.workspace = true
rusplay-decode = { workspace = true, features = ["software", "vaapi"] }

[build-dependencies]
bindgen = { workspace = true, optional = true }
pkg-config = { workspace = true, optional = true }
thiserror.workspace = true

[lints]
workspace = true
