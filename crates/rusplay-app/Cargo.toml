[package]
name = "rusplay-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rusplay"
path = "src/main.rs"

[features]
default = ["flac", "pipewire"]
flac = ["rusplay-client/flac"]
nvdec = ["rusplay-client/nvdec"]
pipewire = ["rusplay-client/pipewire"]
software = ["rusplay-client/software"]
software-asm = ["rusplay-client/software-asm"]
vaapi = ["rusplay-client/vaapi"]

[dependencies]
gpui.workspace = true
gpui_platform = { workspace = true, features = ["wayland"] }
raw-window-handle.workspace = true
rusplay-client = { workspace = true, features = ["window"] }
rusplay-config.workspace = true
thiserror.workspace = true
toml = { workspace = true, features = ["std", "parse", "serde"] }
unicode-segmentation.workspace = true

[dev-dependencies]
rusplay-core.workspace = true

[lints]
workspace = true
