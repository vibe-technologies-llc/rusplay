[package]
name = "rusplay-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
flac = ["rusplay-audio/flac"]
pipewire = ["rusplay-audio/pipewire", "rusplay-capture/pipewire"]
software-encoders = ["svt-av1", "x264", "x265"]
svt-av1 = ["rusplay-encode/svt-av1"]
vaapi = ["rusplay-encode/vaapi"]
x264 = ["rusplay-encode/x264"]
x265 = ["rusplay-encode/x265"]

[dependencies]
parking_lot.workspace = true
pollster.workspace = true
rusplay-audio.workspace = true
rusplay-capture.workspace = true
rusplay-config.workspace = true
rusplay-core.workspace = true
rusplay-encode.workspace = true
rusplay-input.workspace = true
rusplay-net.workspace = true
rusplay-protocol.workspace = true
rusplay-scale.workspace = true
thiserror.workspace = true
wgpu.workspace = true

[dev-dependencies]
rusplay-client = { workspace = true, features = ["software"] }
tempfile.workspace = true

[lints]
workspace = true
