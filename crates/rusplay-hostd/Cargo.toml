[package]
name = "rusplay-hostd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
flac = ["rusplay-host/flac"]
nvenc = ["rusplay-host/nvenc"]
input = ["rusplay-host/input"]
pipewire = ["rusplay-host/pipewire"]
software-encoders = ["rusplay-host/software-encoders"]
svt-av1 = ["rusplay-host/svt-av1"]
vaapi = ["rusplay-host/vaapi"]
x264 = ["rusplay-host/x264"]
x265 = ["rusplay-host/x265"]

[dependencies]
lexopt.workspace = true
parking_lot.workspace = true
rusplay-config.workspace = true
rusplay-host.workspace = true
thiserror.workspace = true

[[test]]
name = "nested"
required-features = ["pipewire", "svt-av1"]

[dev-dependencies]
pollster.workspace = true
rusplay-client = { workspace = true, features = ["software"] }
rusplay-core.workspace = true
rusplay-net.workspace = true
rustix = { workspace = true, features = ["event", "fs", "process"] }
tempfile.workspace = true
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client"] }
wayland-protocols-plasma = { workspace = true, features = ["client"] }
wgpu.workspace = true

[lints]
workspace = true
