[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
rusplay-audio.path = "crates/rusplay-audio"
rusplay-capture.path = "crates/rusplay-capture"
rusplay-client.path = "crates/rusplay-client"
rusplay-config.path = "crates/rusplay-config"
rusplay-core.path = "crates/rusplay-core"
rusplay-decode.path = "crates/rusplay-decode"
rusplay-encode.path = "crates/rusplay-encode"
rusplay-host.path = "crates/rusplay-host"
rusplay-input.path = "crates/rusplay-input"
rusplay-net.path = "crates/rusplay-net"
rusplay-protocol.path = "crates/rusplay-protocol"
rusplay-scale.path = "crates/rusplay-scale"

ashpd = { version = "0.13.13", default-features = false }
bindgen = { version = "0.73.2", default-features = false, features = ["runtime"] }
claxon = "0.4.3"
flacenc = { version = "0.5.1", default-features = false }
gpui = {
    git = "https://github.com/zed-industries/zed",
    rev = "a5c4ca8bf6c4717a328a4a61b42d6d1d38949bcc",
    default-features = false
}
gpui_platform = {
    git = "https://github.com/zed-industries/zed",
    rev = "a5c4ca8bf6c4717a328a4a61b42d6d1d38949bcc",
    default-features = false
}
lexopt = "0.3.2"
opus-rs = { version = "0.1.40", default-features = false }
parking_lot = "0.13.0"
pipewire = { version = "0.10.1", default-features = false }
pkg-config = "0.3.34"
rtrb = "0.4.1"
rubato = { version = "5.0.1", default-features = false }
serde = { version = "1.0.229", default-features = false }
tempfile = { version = "3.27.0", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
toml = { version = "1.1.8", default-features = false }
unicode-segmentation = "1.13.3"
wgpu = { version = "30.0.1", default-features = false }

[patch.crates-io]
async-task = {
    git = "https://github.com/zed-industries/async-task.git",
    rev = "015845a19fc31752c02367567d3b8900a406f9da"
}
calloop = {
    git = "https://github.com/zed-industries/calloop",
    rev = "3759371fee14c40066d64777e2a36b6ffcc22590"
}
khronos-egl = {
    git = "https://github.com/zed-industries/khronos-egl",
    rev = "42214b36347b108fd9630ca6254b96dde59e04fe"
}

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
panic = "unwind"
