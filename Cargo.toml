[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
rusplay-audio.path = "crates/rusplay-audio"
rusplay-capture.path = "crates/rusplay-capture"
rusplay-client.path = "crates/rusplay-client"
rusplay-config.path = "crates/rusplay-config"
rusplay-core.path = "crates/rusplay-core"
rusplay-decode.path = "crates/rusplay-decode"
rusplay-encode.path = "crates/rusplay-encode"
rusplay-host.path = "crates/rusplay-host"
rusplay-input.path = "crates/rusplay-input"
rusplay-net.path = "crates/rusplay-net"
rusplay-protocol.path = "crates/rusplay-protocol"
rusplay-scale.path = "crates/rusplay-scale"

ashpd = { version = "0.13.13", default-features = false }
bindgen = { version = "0.73.2", default-features = false, features = ["runtime"] }
chacha20poly1305 = { version = "0.11.0", default-features = false }
claxon = "0.4.3"
flacenc = { version = "0.5.1", default-features = false }
hkdf = { version = "0.13.0", default-features = false }
lexopt = "0.3.2"
libc = { version = "0.2.191", default-features = false }
opus-rs = { version = "0.1.40", default-features = false }
parking_lot = { version = "0.13.0", default-features = false }
pipewire = { version = "0.10.1", default-features = false }
pkg-config = "0.3.34"
reed-solomon-simd = { version = "3.1.0", default-features = false }
rav1d = { version = "1.1.0", default-features = false }
rtrb = "0.4.1"
rubato = { version = "5.0.1", default-features = false }
rustix = { version = "1.1.5", default-features = false }
serde = { version = "1.0.229", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
spake2 = { version = "0.4.0", default-features = false }
subtle = { version = "2.6.1", default-features = false }
tempfile = { version = "3.27.0", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
toml = { version = "1.1.8", default-features = false }
wgpu = { version = "30.0.1", default-features = false }
zeroize = { version = "1.9.1", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
panic = "unwind"
